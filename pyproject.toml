[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "ai-ssd"
version = "0.1.0"
description = "AI-SSD Co-Design Simulator for High-Performance KV Cache Offloading"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "numpy>=1.24.0",
    "pyyaml>=6.0",
    "pydantic>=2.0.0",
    "pandas>=2.0.0",
    "matplotlib>=3.7.0",
    "seaborn>=0.12.0",
    "pytest>=7.4.0",
    "streamlit>=1.28.0",
    "tqdm>=4.65.0",
]

[tool.pytest.ini_options]
testpaths = ["common/tests", "person1_kv_engine/tests", "person2_ssd/tests", "person3_system/tests"]
pythonpath = ["."]
addopts = "-ra -q"
